<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#f4ecdf">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Sigo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Die Import-Karte muss VOR allem stehen, was Module lädt (auch vor modulepreload): Ältere Browser
       (Chromium vor 133, z. B. der Huawei-Browser) verwerfen sie sonst, und das Spiel startet nicht. -->
  <script type="importmap">
    { "imports": { "pixi": "./vendor/pixi.min.mjs" } }
  </script>
  <link rel="modulepreload" href="vendor/pixi.min.mjs">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4ecdf;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    img, canvas {
      -webkit-user-drag: none;
      user-drag: none;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      touch-action: none;
      outline: none;
    }
    /* ruhiger Lade-Hinweis: drei sanft pulsierende Punkte, ohne Text */
    #laden {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3vmin;
      background: #f4ecdf;
      z-index: 10;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #laden.weg { opacity: 0; }
    /* Meldung für Eltern, falls das Spiel nicht startet (erscheint erst nach langem Warten oder bei einem Fehler) */
    #ladefehler {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12vh;
      z-index: 11;
      padding: 0 8vw;
      text-align: center;
      font: 16px/1.5 system-ui, sans-serif;
      color: #7a6a52;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      white-space: pre-line;
    }
    #ladefehler.da { opacity: 1; }
    #laden span {
      width: 3vmin;
      height: 3vmin;
      border-radius: 50%;
      background: #d9c7a8;
      animation: puls 1.8s ease-in-out infinite;
      opacity: 0.35;
    }
    #laden span:nth-child(2) { animation-delay: 0.3s; }
    #laden span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes puls {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 0.8; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #laden span { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="laden" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="ladefehler"></div>
  <script>
    // Startet das Spiel nicht, sehen die Eltern nach einer Weile, woran es liegt (statt endlos drei Punkte).
    (function () {
      var fehler = [];
      var feld = document.getElementById('ladefehler');
      function laedtNoch() { return !!document.getElementById('laden'); }
      function zeige(text) {
        if (!laedtNoch() || !feld) return;
        feld.textContent = text + (fehler.length ? ' – ' + fehler.slice(0, 3).join(' – ') : '');
        feld.classList.add('da');
      }
      function merke(text) {
        if (!laedtNoch() || fehler.length >= 3) return;
        fehler.push(String(text).slice(0, 200));
        zeige('Das Spiel konnte nicht starten.');
      }
      window.addEventListener('error', function (e) {
        var ziel = e.target;
        if (ziel && ziel !== window && (ziel.src || ziel.href)) merke('Datei fehlt: ' + (ziel.src || ziel.href));
        else merke((e.message || 'Fehler') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        merke(e.reason && e.reason.message ? e.reason.message : e.reason);
      });
      setTimeout(function () { zeige('Das Laden dauert lange. Bitte das WLAN prüfen und das Spiel neu öffnen.'); }, 25000);
      // Ist das Spiel gestartet (Lade-Punkte weg), verschwindet auch die Meldung
      var schau = setInterval(function () {
        if (!laedtNoch()) { clearInterval(schau); if (feld) feld.remove(); }
      }, 1000);
    })();
    // kein Kontextmenü, kein Zoomen per Geste, kein Markieren
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => {
      // im Eltern-Bereich dürfen Regler und Knöpfe normal funktionieren
      if (!(e.target instanceof Element && e.target.closest('#eltern'))) e.preventDefault();
    });
    document.addEventListener('dragstart', (e) => e.preventDefault());
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
